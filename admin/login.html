<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - TarjetasStudio</title>
    <link rel="stylesheet" href="css/crear-diseno.css">
    <script src="../js/i18n.js"></script>
    <style>
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 300px; color: #333; }
        .wrapper { height: 100vh; display: flex; justify-content: center; align-items: center; background: #121212; width: 100%; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="login-box">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
                <script>document.write(i18n.createSwitcher())</script>
            </div>
            <h2 style="margin-top:0" data-i18n="admin_login_title">Iniciar Sesión</h2>
            <div class="control-group">
                <label data-i18n="admin_user">Usuario</label>
                <input type="text" id="user" placeholder="admin" data-i18n-placeholder="admin_user">
            </div>
            <div class="control-group">
                <label data-i18n="admin_pass">Contraseña</label>
                <input type="password" id="pass" placeholder="1234" data-i18n-placeholder="admin_pass" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
            </div>
            <button class="btn-save" onclick="entrar()" data-i18n="admin_btn_enter">ENTRAR</button>
            <div style="margin-top: 20px; text-align: center;">
                <a href="../index.html" style="text-decoration: none; color: var(--primary); font-size: 0.85rem;" data-i18n="btn_back_to_site">← Volver al sitio</a>
            </div>
        </div>
    </div>

    <script>
        async function entrar() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;

            const formData = new FormData();
            formData.append('user', u);
            formData.append('pass', p);
            console.log(formData.values) 
            const resp = await fetch('api.php?action=login', {
                method: 'POST',
                body: formData
            });

            const data = await resp.json();
                console.log(data)
            if (data.success) {
                // Guardamos en LocalStorage como pediste
                localStorage.setItem('user_session', JSON.stringify(data.user));
                window.location.href = 'crear-diseno.html';
            } else {
                alert(i18n.t('wrong_credentials'));
            }
        }
    </script>
</body>
</html>
