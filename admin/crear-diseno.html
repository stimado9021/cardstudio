    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            sidebar.classList.toggle('collapsed');
            document.body.classList.toggle('sidebar-collapsed');
            const icon = document.getElementById('sidebarToggle');
            icon.textContent = sidebar.classList.contains('collapsed') ? '▶' : '☰';
        }

        if (window.innerWidth > 1024) {
            document.getElementById('mainSidebar').classList.add('collapsed');
            document.body.classList.add('sidebar-collapsed');
            document.getElementById('sidebarToggle').textContent = '▶';
        }

        // Orientation control
        let currentOrientation = 'vertical';
        function setOrientation(dir) {
            currentOrientation = dir;
            document.getElementById('orientVertical').classList.toggle('active', dir === 'vertical');
            document.getElementById('orientHorizontal').classList.toggle('active', dir === 'horizontal');
            if (!fondoImg.src || fondoImg.src === window.location.href) {
                if (dir === 'vertical') {
                    canvas.width = 500; canvas.height = 700;
                } else {
                    canvas.width = 700; canvas.height = 500;
                }
                draw();
            }
        }

        // Tab system for mobile
        function switchTab(tab) {
            const configBar = document.querySelector('.config-bar');
            const canvasArea = document.querySelector('.canvas-area');
            const tabConfig = document.getElementById('tab-config');
            const tabCanvas = document.getElementById('tab-canvas');

            if (tab === 'config') {
                configBar.classList.add('tab-active');
                canvasArea.classList.remove('tab-active');
                tabConfig.classList.add('active');
                tabCanvas.classList.remove('active');
            } else {
                canvasArea.classList.add('tab-active');
                configBar.classList.remove('tab-active');
                tabCanvas.classList.add('active');
                tabConfig.classList.remove('active');
            }
        }

        if (window.innerWidth <= 1024) {
            document.querySelector('.config-bar').classList.add('tab-active');
        }

        // Refresh layer bar
        function refreshLayerPanel() {
            const list = document.getElementById('layerList');
            const countEl = document.getElementById('layerCount');
            countEl.textContent = textos.length;

            list.innerHTML = '';
            textos.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'layer-chip' + (i === seleccionadoIdx ? ' active' : '');
                const preview = (t.contenido || '').substring(0, 15) + ((t.contenido || '').length > 15 ? '…' : '');
                item.innerHTML = `<span class="layer-chip-num">${i + 1}</span> ${preview}`;
                item.onclick = () => {
                    seleccionadoIdx = i;
                    actualizarPanelControl();
                    refreshLayerPanel();
                    draw();
                };
                list.appendChild(item);
            });
        }
    </script>
