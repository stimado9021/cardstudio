<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardStudio - Diseños Personalizados</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
    <script src="js/i18n.js"></script>
    <style>
        :root {
            --primary: #ff4d29;
            --primary-hover: #ff2a5f;
            --dark: #0f0f11;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: var(--dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(255, 77, 41, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 42, 95, 0.15), transparent 25%);
            pointer-events: none;
        }

        /* Navbar */
        nav {
            background: rgba(15, 15, 17, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 120px 5% 80px;
            position: relative;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 0;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 30px auto;
            line-height: 1.6;
        }

        /* Grid de Diseños */
        .container {
            padding: 50px 5% 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .grid-diseños {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
        }

        .card-diseno {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .card-diseno::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: 0.4s;
        }

        .card-diseno:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 77, 41, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .card-diseno:hover::before {
            opacity: 1;
        }

        /* Estilo para la miniatura JPG */
        .img-wrapper {
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #111;
        }

        .img-miniatura {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .card-diseno:hover .img-miniatura {
            transform: scale(1.05);
        }

        .card-info h3 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .btn-personalizar {
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 77, 41, 0.2);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-personalizar:hover {
            box-shadow: 0 15px 25px rgba(255, 77, 41, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero {
                padding: 80px 5% 40px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#" class="logo">Card<span>Studio</span></a>
        <div style="display: flex; align-items: center;">
            <a href="admin/login.html" class="nav-link" data-i18n="nav_admin">Admin</a>
            <script>document.write(i18n.createSwitcher())</script>
        </div>
    </nav>

    <header class="hero">
        <h1 data-i18n="hero_title">Crea Momentos Únicos</h1>
        <p data-i18n="hero_subtitle">Elige una plantilla profesional y personalízala con tus propios mensajes en segundos.</p>
    </header>

    <main class="container">
        <h2 style="text-align:center; margin-bottom:40px;" data-i18n="section_title">Nuestras Plantillas</h2>

        <div id="galeria-disenos" class="grid-diseños">
            <p style="text-align:center; grid-column: 1/-1;" data-i18n="loading_catalog">Cargando catálogo...</p>
        </div>
    </main>

    <script>
        async function cargarCatalogo() {
            const contenedor = document.getElementById('galeria-disenos');

            try {
                // Llamamos a la API para obtener los diseños con sus miniaturas JPG
                const response = await fetch('api_publica.php?action=list_designs');
                const disenos = await response.json();

                

                if (disenos.length === 0) {
                    contenedor.innerHTML = `<p style='grid-column: 1/-1;'>${i18n.t('no_designs')}</p>`;
                    return;
                }

                contenedor.innerHTML = ""; // Limpiar mensaje de carga

                disenos.forEach(d => {
                  
                    // Si no tiene miniatura, usamos una por defecto o la de fondo
                    const imgSrc = 'admin/' + d.miniatura_url ? 'admin/' + d.miniatura_url : d.imagen_fondo_url;
                    console.log(imgSrc)
                    const card = `
                        <div class="card-diseno" onclick="personalizar(${d.id_diseno})">
                            <div class="img-wrapper">
                                <img src="${imgSrc}" alt="${d.nombre_diseno}" class="img-miniatura">
                            </div>
                            <div class="card-info">
                                <h3>${d.nombre_diseno || i18n.t('plantilla_especial')}</h3>
                                <button class="btn-personalizar">${i18n.t('btn_customize')}</button>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });

            } catch (error) {
                console.error("Error al cargar catálogo:", error);
                contenedor.innerHTML = `<p style='grid-column: 1/-1;'>${i18n.t('error_loading')}</p>`;
            }
        }

        function personalizar(id) {
            // Enviamos al editor de cliente con el ID del diseño elegido
            
            window.location.href = `editor_cliente.html?id=${id}`;
        }

        // Iniciar carga al abrir la página
        document.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>

</html>
